get:
  tags:
    - Contacts
  summary: Отримати список контактів
  operationId: getContacts
  description: Повертає масив контактів із можливістю фільтрації.
  security:
    - bearerAuth: []
  parameters:
    - name: favorite
      in: query
      description: Фільтр за улюбленими контактами
      required: false
      schema:
        type: boolean
  responses:
    '200':
      description: Список контактів
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas.yaml#/Contact'
